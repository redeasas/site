<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acesso protegido | ASAS HUB</title><link rel="stylesheet" href="../asas-hub.css"><link rel="stylesheet" href="login.css"></head><body class="login-body"><main><a class="login-logo" href="../index.html"><span><img src="../assets/images/logo-rede-asas-oficial.png" alt="Rede ASAS Brasil"></span></a><p class="eyebrow">Acesso protegido</p><h1>Entrar no ASAS HUB</h1><p data-login-intro>Use somente sua conta individual autorizada. O acesso e as alterações sensíveis são auditados.</p><form data-login><label>E-mail institucional<input type="email" name="email" autocomplete="username" required></label><label>Senha<input type="password" name="password" autocomplete="current-password" minlength="10" required></label><button type="submit">Entrar com segurança</button><button class="login-link" type="button" data-forgot>Esqueci minha senha</button><p data-status aria-live="polite"></p></form><small>Problemas de acesso devem ser tratados pelo administrador da Rede ASAS. Não compartilhe senhas ou códigos.</small></main><script src="auth.js"></script><script src="login.js"></script></body></html>
